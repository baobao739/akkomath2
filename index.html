<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MathLab 7→8</title>
<style>
html,body{margin:0;height:100%;background:#0a0a12;color:#c8c8d8;font-family:system-ui,sans-serif}
.boot{display:grid;place-items:center;height:100%;letter-spacing:.04em}
.boot span{opacity:.7;font-size:14px}
</style>
</head>
<body>
<div class="boot"><span>Loading…</span></div>
<script>
(async () => {
  try {
    const parts = await Promise.all([0,1,2,3].map(i => fetch("./p" + i + ".txt").then(r => {
      if (!r.ok) throw new Error("part " + i);
      return r.text();
    })));
    const b64 = parts.join("");
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const ds = new DecompressionStream("gzip");
    const stream = new Blob([bytes]).stream().pipeThrough(ds);
    const html = await new Response(stream).text();
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    document.body.innerHTML = "<div class=boot><span>Failed to load app.</span></div>";
    console.error(e);
  }
})();
</script>
</body>
</html>
